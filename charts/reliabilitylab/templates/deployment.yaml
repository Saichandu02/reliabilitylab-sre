apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-reliabilitylab
  labels:
    app: reliabilitylab
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: reliabilitylab
  template:
    metadata:
      labels:
        app: reliabilitylab
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8000"
    spec:
      {{- if .Values.serviceAccount.create }}
      serviceAccountName: {{ .Values.serviceAccount.name | default (printf "%s-reliabilitylab" .Release.Name) }}
      {{- end }}
      securityContext:
        runAsNonRoot: {{ .Values.security.runAsNonRoot }}
        runAsUser: {{ .Values.security.runAsUser }}
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8000
          env:
            - name: BUILD_VERSION
              value: {{ .Values.env.buildVersion | quote }}
            - name: RELIABILITYLAB_LAB_MODE
              value: {{ .Values.env.labMode | quote }}
            - name: DATABASE_PATH
              value: {{ printf "%s/orders.db" .Values.persistence.mountPath | quote }}
          # Liveness uses /healthz (process only) so a DB outage does not
          # restart-loop the pod; readiness uses /readyz (dependency).
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.livenessPath }}
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readinessPath }}
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: {{ .Values.resources.requests.cpu }}
              memory: {{ .Values.resources.requests.memory }}
            limits:
              cpu: {{ .Values.resources.limits.cpu }}
              memory: {{ .Values.resources.limits.memory }}
          {{- if .Values.persistence.enabled }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.persistence.mountPath }}
          {{- end }}
      {{- if .Values.persistence.enabled }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-reliabilitylab-data
      {{- end }}
